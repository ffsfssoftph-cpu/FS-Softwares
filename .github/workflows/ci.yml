# CI workflow with robustness improvements:
# - Enforce public npm registry
# - Retry npm install with fallback to --force
# - Ensure prisma CLI is present before generate
# - Use `prisma migrate deploy` (CI-safe)
# - Collect diagnostics and upload artifact on failure
name: CI

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:

jobs:
  build:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fs_user
          POSTGRES_PASSWORD: fs_password
          POSTGRES_DB: fs_db
        options: >-
          --health-cmd "pg_isready -U fs_user" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Enforce public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          echo "npm registry: $(npm config get registry)"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (retries and fallback)
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1

          echo "Starting install attempts (max ${max_attempts})"
          until [ $attempt -gt $max_attempts ]; do
            echo "Attempt $attempt/${max_attempts}: npm ci --no-audit --no-fund"
            if npm ci --no-audit --no-fund; then
              echo "npm ci succeeded"
              break
            fi
            echo "npm ci failed on attempt ${attempt}"
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done

          if [ $attempt -gt $max_attempts ]; then
            echo "All npm ci attempts failed — retrying with --force fallback"
            if npm ci --force --no-audit --no-fund; then
              echo "npm ci --force succeeded"
            elif npm install --force --no-audit --no-fund; then
              echo "npm install --force succeeded"
            else
              echo "Forced installs failed — collect diagnostics and exit"
              mkdir -p ci-diagnostics
              npm --version > ci-diagnostics/npm-version.txt || true
              node --version > ci-diagnostics/node-version.txt || true
              npm config list > ci-diagnostics/npm-config.txt || true
              npm cache verify > ci-diagnostics/npm-cache-verify.txt || true
              ls -la > ci-diagnostics/ls-root.txt || true
              cp package-lock.json ci-diagnostics/ 2>/dev/null || true
              if [ -f npm-debug.log ]; then cp npm-debug.log ci-diagnostics/ || true; fi
              exit 1
            fi
          fi

      - name: Ensure Prisma CLI is available
        run: |
          set -euo pipefail
          if npx prisma --version >/dev/null 2>&1; then
            echo "Local prisma binary is present"
            npx prisma --version
          else
            echo "prisma binary not found locally"
            if grep -q '"prisma"' package.json >/dev/null 2>&1 || grep -q '"@prisma/client"' package.json >/dev/null 2>&1; then
              echo "prisma referenced in package.json"
              if npx prisma --version >/dev/null 2>&1; then
                npx prisma --version
              else
                echo "Installing prisma globally as fallback"
                npm i -g prisma
                npx prisma --version
              fi
            else
              echo "prisma not in package.json; installing globally"
              npm i -g prisma
              npx prisma --version
            fi
          fi

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://fs_user:fs_password@localhost:5432/fs_db
        run: |
          set -euo pipefail
          echo "Running prisma migrate deploy"
          npx prisma migrate deploy || echo "No pending migrations"

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          echo "Generating prisma client"
          npx prisma generate

      - name: Run tests
        run: |
          echo "Running tests (if present)"
          npm test --if-present || echo "No tests found"

      - name: Post-build diagnostics (always)
        if: always()
        run: |
          mkdir -p ci-diagnostics
          echo "Runner: $RUNNER_OS" > ci-diagnostics/runner.txt
          node --version > ci-diagnostics/node-version.txt || true
          npm --version > ci-diagnostics/npm-version.txt || true
          npm config list > ci-diagnostics/npm-config.txt || true
          npm cache verify > ci-diagnostics/npm-cache-verify.txt || true
          ps aux > ci-diagnostics/ps-aux.txt 2>/dev/null || true
          df -h > ci-diagnostics/df-h.txt 2>/dev/null || true
          free -m > ci-diagnostics/free-m.txt 2>/dev/null || true
          cp package-lock.json ci-diagnostics/ 2>/dev/null || true
          cp pnpm-lock.yaml ci-diagnostics/ 2>/dev/null || true
          npm ls --all > ci-diagnostics/npm-ls.txt 2>&1 || true
          npx prisma --version > ci-diagnostics/prisma-version.txt 2>&1 || true

      - name: Upload diagnostics artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ci-diagnostics
